<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1B3F"/>
      <stop offset="1" stop-color="#07122A"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#17356F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#102245" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4EC9FF"/>
      <stop offset="1" stop-color="#2DA6E8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="560" rx="20" fill="url(#bg)"/>

  <text x="600" y="52" text-anchor="middle" fill="#EAF3FF" font-family="Arial, sans-serif" font-size="28" font-weight="700">
    SecureOne Deployment Architecture
  </text>
  <text x="600" y="80" text-anchor="middle" fill="#AFC4ED" font-family="Arial, sans-serif" font-size="16">
    Distributed Model: secureone.com ↔ secureone_agent.com
  </text>

  <rect x="70" y="120" width="470" height="360" rx="16" fill="url(#panel)" stroke="#2E5EA9" stroke-width="2" filter="url(#shadow)"/>
  <text x="305" y="156" text-anchor="middle" fill="#BFE5FF" font-family="Arial, sans-serif" font-size="18" font-weight="700">secureone.com</text>

  <rect x="110" y="190" width="390" height="92" rx="12" fill="#132C59" stroke="#4EC9FF" stroke-width="2"/>
  <text x="305" y="225" text-anchor="middle" fill="#F3FAFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">SecureOne UI / API</text>
  <text x="305" y="250" text-anchor="middle" fill="#B7CCEF" font-family="Arial, sans-serif" font-size="14">Control Plane + Policy Engine</text>

  <rect x="110" y="305" width="390" height="92" rx="12" fill="#101F40" stroke="#2F5B9E" stroke-width="2"/>
  <text x="305" y="340" text-anchor="middle" fill="#F3FAFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">PostgreSQL Database</text>
  <text x="305" y="365" text-anchor="middle" fill="#B7CCEF" font-family="Arial, sans-serif" font-size="14">Findings, Metadata, and Scan History</text>

  <rect x="660" y="120" width="470" height="360" rx="16" fill="url(#panel)" stroke="#2E5EA9" stroke-width="2" filter="url(#shadow)"/>
  <text x="895" y="156" text-anchor="middle" fill="#BFE5FF" font-family="Arial, sans-serif" font-size="18" font-weight="700">secureone_agent.com</text>

  <rect x="700" y="180" width="390" height="76" rx="12" fill="#132C59" stroke="#4EC9FF" stroke-width="2"/>
  <text x="895" y="212" text-anchor="middle" fill="#F3FAFF" font-family="Arial, sans-serif" font-size="19" font-weight="700">SecureOne Scan Agent</text>
  <text x="895" y="234" text-anchor="middle" fill="#B7CCEF" font-family="Arial, sans-serif" font-size="13">Job Execution + Result Upload</text>

  <rect x="700" y="272" width="390" height="76" rx="12" fill="#101F40" stroke="#2F5B9E" stroke-width="2"/>
  <text x="895" y="304" text-anchor="middle" fill="#F3FAFF" font-family="Arial, sans-serif" font-size="19" font-weight="700">Jenkins</text>
  <text x="895" y="326" text-anchor="middle" fill="#B7CCEF" font-family="Arial, sans-serif" font-size="13">Pipeline Trigger + Workspace</text>

  <rect x="700" y="364" width="390" height="76" rx="12" fill="#101F40" stroke="#2F5B9E" stroke-width="2"/>
  <text x="895" y="396" text-anchor="middle" fill="#F3FAFF" font-family="Arial, sans-serif" font-size="19" font-weight="700">Tool Images</text>
  <text x="895" y="418" text-anchor="middle" fill="#B7CCEF" font-family="Arial, sans-serif" font-size="13">Semgrep • Snyk • Gitleaks</text>

  <line x1="540" y1="292" x2="660" y2="292" stroke="url(#primary)" stroke-width="4"/>
  <polygon points="660,292 642,282 642,302" fill="#4EC9FF"/>
  <polygon points="540,292 558,282 558,302" fill="#4EC9FF"/>
  <text x="600" y="278" text-anchor="middle" fill="#9ED8FF" font-family="Arial, sans-serif" font-size="14" font-weight="700">API + Scan Job Exchange</text>

  <rect x="410" y="500" width="380" height="34" rx="999" fill="#0F244A" stroke="#2F5B9E"/>
  <circle cx="434" cy="517" r="6" fill="#4EC9FF"/>
  <text x="448" y="522" fill="#D8E7FF" font-family="Arial, sans-serif" font-size="13">Recommended enterprise deployment for scale and isolation</text>
</svg>
